server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ส่ง /api ต่อไปยัง backend (service ชื่อ "backend" ใน docker-compose)
  # ใช้ตัวแปร + resolver ของ Docker เพื่อให้ nginx ไม่ล้มตอนสตาร์ตถ้า backend ยังไม่พร้อม
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 10m;

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ไฟล์ใน /assets มี hash ในชื่อ (Vite) เปลี่ยนเนื้อหา = เปลี่ยนชื่อ จึง cache ได้นาน
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html (และทุกหน้าของ SPA ที่ fallback มาที่ไฟล์นี้) ต้องไม่ถูก cache
  # ไม่งั้นหลัง deploy เวอร์ชันใหม่ ผู้ใช้จะยังเห็นหน้าเก่าจนกว่าจะกด F5 / รีเฟรชแรงๆ
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
